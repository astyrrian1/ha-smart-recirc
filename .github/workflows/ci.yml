name: Home Assistant validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Build a draft HACS release from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ha-smart-recirc-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Read dependency lock
        id: library
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('library.lock.json').read_text())
          assert lock['repository'] == 'astyrrian1/leridian-smart-recirc'
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"commit={lock['commit']}\n")
          PY
      - name: Check out pinned Python library
        uses: actions/checkout@v4
        with:
          repository: astyrrian1/leridian-smart-recirc
          ref: ${{ steps.library.outputs.commit }}
          path: .deps/library
          ssh-key: ${{ secrets.SMART_RECIRC_LIBRARY_DEPLOY_KEY }}
          persist-credentials: false
      - name: Create isolated Python environment
        run: |
          python -m venv --clear "$RUNNER_TEMP/ha-smart-recirc-venv"
          echo "$RUNNER_TEMP/ha-smart-recirc-venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install .deps/library
      - run: ruff check custom_components tests tools
      - run: pytest -q
      - run: python tools/build_integration.py
      - run: python tools/validate_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: smart-recirc-installation
          path: dist/smart_recirc.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, linux, x64, ha-smart-recirc-ci]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: smart-recirc-installation
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/smart_recirc/manifest.json'));
            const tag = `v${manifest.version}`;
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `Leridian Smart Recirc ${tag}`, draft: true,
              body: 'Install and update through HACS. This asset includes the pinned Python protocol library. See docs/installation.md for migration and verification.'
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name: 'smart_recirc.zip',
              data: fs.readFileSync('dist/smart_recirc.zip')
            });
